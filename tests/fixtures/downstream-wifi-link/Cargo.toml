[package]
name = "downstream-wifi-link"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
esp8266-hal = { path = "../../..", default-features = false, features = ["wifi"] }
panic-halt = "1"
esp-alloc = "=0.4.0"

[profile.release]
codegen-units = 8
lto = "thin"
opt-level = "s"
