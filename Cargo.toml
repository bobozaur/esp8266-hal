[workspace]
members = [".", "esp8266", "procmacros", "esp8266-wifi-sys", "xtask"]
resolver = "2"

[package]
name = "esp8266-hal"
version = "0.5.1"
authors = ["Jesse Braham <jesse@beta7.io>", "Robin Appelman <robin@icewind.nl>"]
edition = "2021"
description = "HAL for ESP8266 microcontrollers"
repository = "https://github.com/esp-rs/esp8266-hal"
license = "MIT OR Apache-2.0"
autoexamples = false

keywords = ["embedded", "embedded-hal", "esp", "esp8266", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
embedded-hal = { version = "0.2", features = ["unproven"] }
esp8266 = { version = "0.7", path = "./esp8266" }
nb = "1.0"
paste = { version = "1.0", optional = true }
void = { version = "1.0", default-features = false }
xtensa-lx = { version = "0.8", features = ["esp8266"] }
xtensa-lx-rt = { version = "0.12", features = ["esp8266"], optional = true }

esp8266-hal-proc-macros = { path = "procmacros", version = "=0.1" }

# WiFi dependencies (optional, enabled by `wifi` feature)
esp8266-wifi-sys = { path = "esp8266-wifi-sys", optional = true }
portable-atomic = { version = "1", default-features = false, optional = true }
heapless = { version = "0.8", optional = true }
esp-alloc = { version = "=0.4.0", optional = true }
bitflags = { version = "2", optional = true }
log = { version = "0.4", optional = true }
smoltcp = { version = "0.12", default-features = false, features = [
  "medium-ethernet",
  "proto-ipv4",
  "socket-tcp",
  "socket-udp",
  "socket-dhcpv4",
], optional = true }
embassy-executor = { version = "=0.6.3", default-features = false, features = ["task-arena-size-1024", "integrated-timers"], optional = true }
embassy-time = { version = "=0.3.2", default-features = false, features = [
  "tick-hz-1_000_000",
], optional = true }
embassy-time-driver = { version = "=0.1.0", default-features = false, optional = true }
embassy-time-queue-driver = { version = "=0.1.0", default-features = false, optional = true }
embassy-sync = { version = "=0.6.2", default-features = false, optional = true }
critical-section = { version = "1.2", features = [
  "restore-state-u32",
], optional = true }
embassy-net-driver-channel = { version = "=0.3.0", optional = true }
embassy-futures = { version = "=0.1.1", optional = true }
static_cell = { version = "2", optional = true }

[target.'cfg(target_arch = "xtensa")'.dependencies]
portable-atomic = { version = "1", default-features = false, features = [
  "unsafe-assume-single-core",
], optional = true }

[dev-dependencies]
panic-halt = "1.0"
embassy-net = { version = "=0.5.0", default-features = false, features = [
  "proto-ipv4",
  "medium-ethernet",
  "tcp",
  "udp",
  "dhcpv4",
] }
embedded-io-async = "0.6"
embassy-futures = "0.1"

[target.'cfg(not(target_arch = "xtensa"))'.dev-dependencies]
proptest = { version = "=1.6.0", default-features = false, features = ["std"] }

[[example]]
name = "blinky"

[[example]]
name = "entry_probe"

[[example]]
name = "flash"

[[example]]
name = "reset_probe"

[[example]]
name = "serial"

[[example]]
name = "uart_interrupt"

[[example]]
name = "tcp_client"
required-features = ["wifi-embassy-net", "wifi-sta"]

[[example]]
name = "tcp_server"
required-features = ["wifi-embassy-net", "wifi-sta"]

[[example]]
name = "sta_static_ip"
required-features = ["wifi-embassy-net", "wifi-sta"]

[[example]]
name = "wifi_core_connect"
required-features = ["wifi-core", "wifi", "wifi-sta", "rt", "interrupt"]

[[example]]
name = "wifi_core_dhcp_probe"
required-features = ["wifi-embassy-net", "wifi-sta"]

[[example]]
name = "raw_scan"
required-features = ["wifi-core", "wifi", "wifi-sta", "rt", "interrupt"]

[[example]]
name = "wifi_ap"
required-features = ["wifi-ap", "rt", "interrupt"]

[[example]]
name = "wifi_ap_sta"
required-features = ["wifi-ap", "wifi-sta", "wifi-embassy-net", "rt", "interrupt"]

[[example]]
name = "wifi_promisc"
required-features = ["wifi-promiscuous", "wifi-sta", "rt", "interrupt"]

[[example]]
name = "wifi_esp_now_tx"
required-features = ["wifi-esp-now", "wifi-sta", "rt", "interrupt"]

[[example]]
name = "wifi_esp_now_rx"
required-features = ["wifi-esp-now", "wifi-sta", "rt", "interrupt"]

[[example]]
name = "wifi_wps"
required-features = ["wifi-wps", "wifi-sta", "rt", "interrupt"]

[[example]]
name = "wifi_smartconfig"
required-features = ["wifi-smartconfig", "wifi-sta", "rt", "interrupt"]

[features]
default = ["interrupt", "rt"]
interrupt = ["paste"]
rt = ["xtensa-lx-rt"]
wifi-core = [
  "dep:portable-atomic",
  "dep:heapless",
  "dep:critical-section",
]
wifi = [
  "wifi-core",
  "dep:esp8266-wifi-sys",
  "dep:esp-alloc",
  "dep:bitflags",
  "dep:log",
  "dep:smoltcp",
  "dep:embassy-executor",
  "dep:embassy-time",
  "dep:embassy-time-driver",
  "dep:embassy-time-queue-driver",
  "dep:embassy-sync",
  "dep:critical-section",
  "dep:static_cell",
]
wifi-sta = ["wifi"]
wifi-ap = ["wifi"]
wifi-embassy-net = [
  "wifi",
  "dep:embassy-net-driver-channel",
  "dep:embassy-futures",
]
wifi-wps = ["wifi"]
wifi-smartconfig = ["wifi", "esp8266-wifi-sys/smartconfig"]
wifi-promiscuous = ["wifi"]
wifi-esp-now = ["wifi", "esp8266-wifi-sys/esp-now"]
wifi-debug-log = []
wifi-debug-trace = ["wifi-debug-log"]

# Place program completely in RAM (needed when e.g. using only ROM bootloader,
# or for debugging).
all_in_ram = []

[profile.dev]
lto = true
opt-level = "s"

# Workaround for linker errors when using lto with the dev profile:
# https://github.com/rust-lang/compiler-builtins/issues/347
[profile.dev.package.compiler_builtins]
overflow-checks = false

[profile.release]
lto = "thin"
# Full/fat LTO still trips an Xtensa LLVM register-spill bug on the esp-rs
# 1.80.0.0 toolchain when compiling the larger embassy-net examples. Thin LTO
# preserves cross-CGU optimization while keeping release builds reliable.
# codegen-units > 1 remains necessary on this toolchain, and the resulting
# .bss overhead is acceptable given the 80 KB DRAM budget.
codegen-units = 8

[patch.crates-io]
smoltcp = { path = "vendor/smoltcp" }
