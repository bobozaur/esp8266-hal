[workspace]
members = [".", "esp8266", "procmacros", "esp8266-wifi-sys"]
resolver = "2"

[package]
name = "esp8266-hal"
version = "0.6.0"
authors = ["Jesse Braham <jesse@beta7.io>", "Robin Appelman <robin@icewind.nl>"]
edition = "2021"
rust-version = "1.80"
description = "HAL for ESP8266 microcontrollers"
repository = "https://github.com/esp-rs/esp8266-hal"
license = "MIT OR Apache-2.0"
autoexamples = false
include = [
  "/src/**",
  "/examples/*.rs",
  "/examples/support/**",
  "/tests/*.rs",
  "/ld/**",
  "/build.rs",
  "/README.md",
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
]

keywords = ["embedded", "embedded-hal", "esp", "esp8266", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
embedded-hal = { version = "0.2", features = ["unproven"] }
esp8266 = { version = "0.7", path = "./esp8266", default-features = false, features = ["critical-section"] }
nb = "1.0"
void = { version = "1.0", default-features = false }

esp8266-hal-proc-macros = { path = "procmacros", version = "=0.2.0", default-features = false }

# Wi-Fi remains optional: upstream allocation containers require an application
# global allocator even when the radio is unused. Runtime initialization stays explicit.
esp8266-wifi-sys = { version = "=0.1.0", path = "esp8266-wifi-sys", default-features = false, optional = true }
portable-atomic = { version = "1", default-features = false, optional = true }
heapless = { version = "0.8", optional = true }
allocator-api2 = { version = "=0.2.18", default-features = false, features = ["alloc"], optional = true }
# smoltcp 0.12 requires a socket when Ethernet is enabled. UDP is the minimal
# baseline; applications select additional protocols on their smoltcp dependency.
smoltcp = { version = "0.12", default-features = false, features = [
  "medium-ethernet",
  "proto-ipv4",
  "socket-udp",
], optional = true }
embassy-executor = { version = "=0.6.3", default-features = false, features = ["task-arena-size-1024"], optional = true }
embassy-time = { version = "=0.3.2", default-features = false, features = [
  "tick-hz-1_000_000",
  "generic-queue",
], optional = true }
embassy-time-driver = { version = "=0.1.0", default-features = false, optional = true }
critical-section = { version = "1.2", features = ["restore-state-u64"] }
embassy-net-driver-channel = { version = "=0.3.0", optional = true }
embassy-futures = { version = "=0.1.1", optional = true }

[target.'cfg(target_arch = "xtensa")'.dependencies]
portable-atomic = { version = "1", default-features = false, features = [
  "unsafe-assume-single-core",
], optional = true }
xtensa-lx = { version = "0.8", features = ["esp8266"] }
xtensa-lx-rt = { version = "0.12", features = ["esp8266"], optional = true }

[dev-dependencies]
panic-halt = "1.0"
esp-alloc = "=0.4.0"
static_cell = "2"
embassy-net = { version = "=0.5.0", default-features = false, features = [
  "proto-ipv4",
  "medium-ethernet",
  "tcp",
  "udp",
  "dhcpv4",
] }
embedded-io-async = "0.6"
embassy-futures = "0.1"
# The examples have at most three timed tasks. Applications select their own
# queue capacity through embassy-time without changing the HAL's features.
embassy-time = { version = "=0.3.2", default-features = false, features = ["generic-queue-8"] }
smoltcp = { version = "0.12", default-features = false, features = [
  "medium-ethernet",
  "proto-ipv4",
  "socket-tcp",
  "socket-udp",
  "socket-dhcpv4",
] }

[target.'cfg(not(target_arch = "xtensa"))'.dev-dependencies]
proptest = { version = "=1.6.0", default-features = false, features = ["std"] }
embassy-time = { version = "=0.3.2", default-features = false, features = ["mock-driver"] }

[target.'cfg(target_arch = "xtensa")'.dev-dependencies]
portable-atomic = { version = "1", default-features = false, features = ["unsafe-assume-single-core"] }

[[example]]
name = "blinky"

[[example]]
name = "flash"

[[example]]
name = "serial"

[[example]]
name = "uart_interrupt"

[[example]]
name = "tcp_client"
required-features = ["wifi-embassy-net", "embassy"]

[[example]]
name = "tcp_server"
required-features = ["wifi-embassy-net", "embassy"]

[[example]]
name = "sta_static_ip"
required-features = ["wifi-embassy-net", "embassy"]

[[example]]
name = "wifi_core_connect"
required-features = ["wifi"]

[[example]]
name = "raw_scan"
required-features = ["wifi"]

[[example]]
name = "wifi_ap"
required-features = ["wifi"]

[[example]]
name = "wifi_ap_sta"
required-features = ["wifi"]

[[example]]
name = "wifi_promisc"
required-features = ["wifi-promiscuous"]

[[example]]
name = "wifi_esp_now_tx"
required-features = ["wifi-esp-now"]

[[example]]
name = "wifi_esp_now_rx"
required-features = ["wifi-esp-now"]

[[example]]
name = "wifi_wps"
required-features = ["wifi-wps"]

[[example]]
name = "wifi_smartconfig"
required-features = ["wifi-smartconfig", "wifi-smoltcp"]

[[example]]
name = "wifi_eap"
required-features = ["wifi-enterprise"]

[[test]]
name = "wifi_core_config"
required-features = ["wifi"]

[[test]]
name = "wifi_core_provisioning"
required-features = ["wifi-smartconfig"]

[features]
default = ["interrupt", "rt"]
interrupt = []
rt = ["dep:xtensa-lx-rt"]
wifi = [
  "rt",
  "interrupt",
  "dep:portable-atomic",
  "dep:heapless",
  "dep:allocator-api2",
  "dep:esp8266-wifi-sys",
]
embassy = [
  "wifi",
  "dep:embassy-executor",
  "dep:embassy-time",
  "dep:embassy-time-driver",
]
wifi-smoltcp = ["wifi", "dep:smoltcp"]
wifi-embassy-net = [
  "wifi",
  "dep:embassy-net-driver-channel",
  "dep:embassy-futures",
  "dep:embassy-time",
  "dep:embassy-time-driver",
]
wifi-smartconfig = ["wifi", "esp8266-wifi-sys/smartconfig"]
wifi-esp-now = ["wifi", "esp8266-wifi-sys/esp-now"]
wifi-enterprise = ["wifi"]
wifi-wps = ["wifi"]
wifi-promiscuous = ["wifi"]

# Place program completely in RAM (needed when e.g. using only ROM bootloader,
# or for debugging).
all_in_ram = []

[profile.dev]
lto = true
opt-level = "s"

[profile.release]
lto = "thin"
# Full/fat LTO still trips an Xtensa LLVM register-spill bug on the esp-rs
# 1.80.0.0 toolchain when compiling the larger embassy-net examples. Thin LTO
# preserves cross-CGU optimization while keeping release builds reliable.
# codegen-units > 1 remains necessary on this toolchain, and the resulting
# .bss overhead must fit the linker-enforced DRAM and stack budgets.
codegen-units = 8
