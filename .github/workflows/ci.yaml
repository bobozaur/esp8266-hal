on:
  pull_request:
    branches:
      - main
  push:
  workflow_dispatch:

name: CI

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test-host:
    name: Host tests
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify vendored WiFi inputs
        working-directory: esp8266-wifi-sys/vendor
        run: sha256sum --check --strict SHA256SUMS
      - name: Test the Wi-Fi state and resource contracts
        run: cargo test --target x86_64-unknown-linux-gnu --no-default-features --features wifi --lib --tests
      - name: Test ESP-NOW in isolation
        run: cargo test --target x86_64-unknown-linux-gnu --no-default-features --features wifi-esp-now --lib --tests
      - name: Test SmartConfig in isolation
        run: cargo test --target x86_64-unknown-linux-gnu --no-default-features --features wifi-smartconfig --lib --tests
      - name: Test enterprise configuration in isolation
        run: cargo test --target x86_64-unknown-linux-gnu --no-default-features --features wifi-enterprise --lib --tests
      - name: Test WPS in isolation
        run: cargo test --target x86_64-unknown-linux-gnu --no-default-features --features wifi-wps --lib --tests
      - name: Test promiscuous capture in isolation
        run: cargo test --target x86_64-unknown-linux-gnu --no-default-features --features wifi-promiscuous --lib --tests
      - name: Test network adapters and optional components together
        run: cargo test --target x86_64-unknown-linux-gnu --no-default-features --features wifi-embassy-net,wifi-smoltcp,wifi-esp-now,wifi-smartconfig,wifi-enterprise,wifi-wps,wifi-promiscuous --lib --tests
      - name: Test the vendored ABI crate
        run: cargo test -p esp8266-wifi-sys --target x86_64-unknown-linux-gnu
      - name: Verify the vendored ABI package
        run: cargo package -p esp8266-wifi-sys --target x86_64-unknown-linux-gnu
      - name: Verify supporting packages
        run: |
          cargo package -p esp8266 --target x86_64-unknown-linux-gnu
          cargo package -p esp8266-hal-proc-macros --target x86_64-unknown-linux-gnu
          cargo package -p esp8266-hal --list
      - name: Test the hardware harness
        run: cargo test -p xtask --target x86_64-unknown-linux-gnu
      - name: Test proc macros without WiFi
        run: cargo test -p esp8266-hal-proc-macros --target x86_64-unknown-linux-gnu --no-default-features
      - name: Check async proc-macro diagnostic without WiFi
        run: |
          if cargo check --target x86_64-unknown-linux-gnu --manifest-path tests/fixtures/async-main-no-wifi/Cargo.toml >macro-check.log 2>&1; then
            cat macro-check.log
            exit 1
          fi
          grep --fixed-strings 'async `#[main]` is not supported' macro-check.log
      - name: Lint host-testable WiFi code
        run: cargo clippy --no-deps --target x86_64-unknown-linux-gnu --no-default-features --features wifi --lib --tests -- -D warnings -A clippy::missing-safety-doc -A clippy::type-complexity -A clippy::legacy-numeric-constants
      - name: Lint all optional WiFi components together
        run: cargo clippy --no-deps --target x86_64-unknown-linux-gnu --no-default-features --features wifi-embassy-net,wifi-smoltcp,wifi-esp-now,wifi-smartconfig,wifi-enterprise,wifi-wps,wifi-promiscuous --lib --tests -- -D warnings -A clippy::missing-safety-doc -A clippy::type-complexity -A clippy::legacy-numeric-constants
      - name: Lint the hardware harness
        run: cargo clippy --no-deps -p xtask --target x86_64-unknown-linux-gnu -- -D warnings -A clippy::too-many-arguments
      - name: Lint the vendored ABI crate
        run: cargo clippy --no-deps -p esp8266-wifi-sys --target x86_64-unknown-linux-gnu -- -D warnings
      - name: Lint proc macros
        run: cargo clippy --no-deps -p esp8266-hal-proc-macros --target x86_64-unknown-linux-gnu --lib --tests -- -D warnings

  build-wifi-examples:
    name: Link WiFi example (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-connect
            example: wifi_core_connect
            features: wifi
          - name: scan
            example: raw_scan
            features: wifi
          - name: dhcp
            example: wifi_core_dhcp_probe
            features: wifi-embassy-net
          - name: tcp-server
            example: tcp_server
            features: wifi-embassy-net
          - name: tcp-client
            example: tcp_client
            features: wifi-embassy-net
          - name: static-ip
            example: sta_static_ip
            features: wifi-embassy-net
          - name: access-point
            example: wifi_ap
            features: embassy
          - name: mixed-mode
            example: wifi_ap_sta
            features: wifi-embassy-net
          - name: wps
            example: wifi_wps
            features: wifi-wps,embassy
          - name: smartconfig
            example: wifi_smartconfig
            features: wifi-smartconfig,wifi-smoltcp
          - name: esp-now-tx
            example: wifi_esp_now_tx
            features: wifi-esp-now,embassy
          - name: esp-now-rx
            example: wifi_esp_now_rx
            features: wifi-esp-now,embassy
          - name: promiscuous
            example: wifi_promisc
            features: wifi-promiscuous,embassy
          - name: enterprise
            example: wifi_eap
            features: wifi-enterprise
          - name: all-optional-components
            example: tcp_server
            features: wifi-embassy-net,wifi-smoltcp,wifi-smartconfig,wifi-esp-now,wifi-enterprise,wifi-wps,wifi-promiscuous
          - name: downstream-consumer
            kind: downstream
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          buildtargets: esp32
          default: false
          export: false
          ldproxy: false
          name: esp-1.80.0
          version: 1.80.0.0
      - name: Install pinned ESP8266 GCC linker
        env:
          TOOLCHAIN_SHA256: 0a1804b5e2231c6db8b72af6bc2a0f9a5b6994cfba29956d412651109f13fe7e
          TOOLCHAIN_URL: https://dl.espressif.com/dl/xtensa-lx106-elf-gcc8_4_0-esp-2020r3-linux-amd64.tar.gz
        run: |
          archive="$RUNNER_TEMP/xtensa-lx106-elf.tar.gz"
          curl --fail --location --retry 3 "$TOOLCHAIN_URL" --output "$archive"
          echo "$TOOLCHAIN_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xtensa-lx106-elf/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - name: Link release firmware
        if: ${{ matrix.name != 'downstream-consumer' }}
        run: |
          if [[ "${{ matrix.example }}" == wifi_smartconfig ]]; then
            export ESP8266_HAL_SMARTCONFIG_STATIC_ACK=1
          fi
          cargo build --release --example ${{ matrix.example }} --target xtensa-esp8266-none-elf -Zbuild-std=core,alloc --no-default-features --features ${{ matrix.features }}
      - name: Document the target API
        if: ${{ matrix.name == 'all-optional-components' }}
        run: cargo doc --no-deps --lib --target xtensa-esp8266-none-elf -Zbuild-std=core,alloc --no-default-features --features ${{ matrix.features }}
      - name: Report linked image size
        if: ${{ matrix.name != 'downstream-consumer' }}
        run: xtensa-lx106-elf-size target/xtensa-esp8266-none-elf/release/examples/${{ matrix.example }}
      - name: Link non-WiFi firmware
        if: ${{ matrix.name == 'downstream-consumer' }}
        run: |
          rustup run esp-1.80.0 cargo check --target xtensa-esp8266-none-elf -Zbuild-std=core,alloc --no-default-features
          rustup run esp-1.80.0 cargo build --release --example blinky --target xtensa-esp8266-none-elf -Zbuild-std=core,alloc
          xtensa-lx106-elf-size target/xtensa-esp8266-none-elf/release/examples/blinky
      - name: Link an external consumer with its own Cargo configuration
        if: ${{ matrix.name == 'downstream-consumer' }}
        run: |
          consumer="$RUNNER_TEMP/esp8266-hal-consumer"
          cp -r tests/fixtures/downstream-wifi-link "$consumer"
          sed -i "s|path = \"../../..\"|path = \"$GITHUB_WORKSPACE\"|" "$consumer/Cargo.toml"
          cd "$consumer"
          rustup run esp-1.80.0 cargo generate-lockfile
          for features in "" wifi-smoltcp wifi-embassy-net wifi-smoltcp,wifi-embassy-net; do
            rustup run esp-1.80.0 cargo build --locked --release -Zbuild-std=core,alloc --features "$features"
            xtensa-lx106-elf-size target/xtensa-esp8266-none-elf/release/downstream-wifi-link
          done
