name: CI

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  WIFI_FEATURES: embassy,wifi-embassy-net,wifi-smoltcp,wifi-esp-now,wifi-smartconfig,wifi-enterprise,wifi-wps,wifi-promiscuous

jobs:
  host:
    name: Library contracts and packages
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting and native inputs
        run: |
          cargo fmt --all -- --check
          (cd esp8266-wifi-sys/vendor && sha256sum --check --strict SHA256SUMS)
      - name: Test library contracts
        run: |
          cargo test --target x86_64-unknown-linux-gnu --no-default-features --lib --tests
          cargo test --target x86_64-unknown-linux-gnu --no-default-features --features wifi --lib --tests
          cargo test --target x86_64-unknown-linux-gnu --no-default-features --features "$WIFI_FEATURES" --lib --tests
          cargo test --target x86_64-unknown-linux-gnu -p esp8266-wifi-sys -p esp8266-hal-proc-macros
      - name: Check independent feature declarations
        run: |
          for feature in embassy wifi-smoltcp wifi-embassy-net wifi-esp-now wifi-smartconfig wifi-enterprise wifi-wps wifi-promiscuous; do
            cargo check --target x86_64-unknown-linux-gnu --no-default-features --features "$feature" --lib --tests
          done
      - name: Lint maintained Rust code
        run: |
          for features in wifi "$WIFI_FEATURES"; do
            cargo clippy --no-deps --target x86_64-unknown-linux-gnu --no-default-features --features "$features" --lib --tests -- -D warnings -A clippy::missing-safety-doc -A clippy::type-complexity -A clippy::legacy-numeric-constants
          done
          cargo clippy --no-deps --target x86_64-unknown-linux-gnu -p esp8266-wifi-sys -p esp8266-hal-proc-macros --lib --tests -- -D warnings
      - name: Verify all four published packages together
        run: cargo package -p esp8266 -p esp8266-hal-proc-macros -p esp8266-wifi-sys -p esp8266-hal --features esp8266-hal/wifi,esp8266-hal/wifi-smartconfig --target x86_64-unknown-linux-gnu

  target:
    name: ESP8266 firmware and downstream linking
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUSTUP_TOOLCHAIN: esp-1.80.0
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          buildtargets: esp32
          default: false
          export: false
          ldproxy: false
          name: esp-1.80.0
          version: 1.80.0.0
      - name: Install pinned ESP8266 GCC linker
        env:
          TOOLCHAIN_SHA256: 0a1804b5e2231c6db8b72af6bc2a0f9a5b6994cfba29956d412651109f13fe7e
          TOOLCHAIN_URL: https://dl.espressif.com/dl/xtensa-lx106-elf-gcc8_4_0-esp-2020r3-linux-amd64.tar.gz
        run: |
          archive="$RUNNER_TEMP/xtensa-lx106-elf.tar.gz"
          curl --fail --location --retry 3 "$TOOLCHAIN_URL" --output "$archive"
          echo "$TOOLCHAIN_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xtensa-lx106-elf/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - name: Link HAL examples without Wi-Fi
        run: |
          cargo check --target xtensa-esp8266-none-elf -Zbuild-std=core,alloc --no-default-features
          cargo build --release --examples --target xtensa-esp8266-none-elf -Zbuild-std=core,alloc
          cargo build --release --example blinky --target xtensa-esp8266-none-elf -Zbuild-std=core,alloc --features all_in_ram
      - name: Link supported Wi-Fi feature combinations
        run: |
          for features in wifi embassy embassy,wifi-embassy-net wifi-wps wifi-smartconfig,wifi-smoltcp wifi-esp-now wifi-promiscuous wifi-enterprise "$WIFI_FEATURES"; do
            cargo build --release --examples --target xtensa-esp8266-none-elf -Zbuild-std=core,alloc --no-default-features --features "$features"
          done
          cargo doc --no-deps --lib --target xtensa-esp8266-none-elf -Zbuild-std=core,alloc --no-default-features --features "$WIFI_FEATURES"
      - name: Link an external consumer with its own configuration
        run: |
          consumer="$RUNNER_TEMP/esp8266-hal-consumer"
          cp -r tests/fixtures/downstream-wifi-link "$consumer"
          sed -i "s|path = \"../../..\"|path = \"$GITHUB_WORKSPACE\"|" "$consumer/Cargo.toml"
          cd "$consumer"
          cargo generate-lockfile
          for features in "" wifi-smoltcp wifi-embassy-net wifi-smoltcp,wifi-embassy-net; do
            cargo build --locked --release -Zbuild-std=core,alloc --features "$features"
            xtensa-lx106-elf-size -A target/xtensa-esp8266-none-elf/release/downstream-wifi-link
          done
