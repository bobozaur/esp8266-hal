[build]
target = "xtensa-esp8266-none-elf"

rustflags = [
  "-C",
  "link-arg=-nostartfiles",
  "-C",
  "link-arg=-Tlink.x",
  "-C",
  "link-arg=-Tesp8266.rom.ld",
  "-C",
  "link-arg=-Tesp8266.peripherals.ld",
  "-C",
  "link-arg=-Wl,--allow-multiple-definition",
]

[target.xtensa-esp8266-none-elf]
linker = "xtensa-lx106-elf-gcc"
runner = "xtensa-lx106-elf-gdb -q -x openocd.gdb"

[unstable]
build-std = ["core"]
